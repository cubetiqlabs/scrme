name: Release

on:
  # Tag pushed by scripts/release.sh
  push:
    tags: ["v*"]
  # Or run from the Actions tab: bumps version, commits, tags, pushes, then builds
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      force:
        description: Override the tag if it already exists (force push)
        type: boolean
        default: false
      dry_run:
        description: Dry run (show what would happen, build nothing)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Version & tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump, commit, tag, push
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=("${{ inputs.bump }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          scripts/release.sh "${args[@]}"
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          # Prebuilt CLI via npx (seconds) instead of compiling tauri-cli (minutes).
          tauriScript: npx --yes @tauri-apps/cli@2
          uploadUpdaterJson: true
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: scrme ${{ needs.prepare.outputs.tag }}
          releaseBody: |
            Install: `curl -fsSL https://raw.githubusercontent.com/cubetiqlabs/scrme/main/install.sh | bash`
            or download the .dmg below.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
