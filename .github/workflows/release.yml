name: Release

on:
  # Tag pushed by scripts/release.sh
  push:
    tags: ["v*"]
  # Or run from the Actions tab: bumps version, commits, tags, pushes, then builds
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      force:
        description: Override the tag if it already exists (force push)
        type: boolean
        default: false
      dry_run:
        description: Dry run (show what would happen, build nothing)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Version & tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump, commit, tag, push
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=("${{ inputs.bump }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          scripts/release.sh "${args[@]}"
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    env:
      # Stable self-signed code-signing certificate (see "macOS signing" in AGENTS.md).
      # TCC binds Screen Recording to the code identity; ad-hoc signatures change every
      # build, so releases of the same app must all be signed with the same certificate.
      MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install macOS signing certificate
        if: env.MACOS_SIGNING_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/scrme-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT="$RUNNER_TEMP/scrme-signing.p12"

          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Put the temporary keychain first; keep the runner's login keychain in the list.
          security list-keychain -d user -s "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$CERT"

          # Tauri signs with this identity from the default keychain.
          IDENTITY="${MACOS_SIGNING_IDENTITY:-scrme Stable Signing}"
          security find-certificate -c "$IDENTITY" "$KEYCHAIN" >/dev/null 2>&1
          echo "Signing macOS bundles with: $IDENTITY"
          jq --arg id "$IDENTITY" '.bundle.macOS.signingIdentity = $id' \
            src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" src-tauri/tauri.conf.json
      - name: Warn about ad-hoc signing
        if: env.MACOS_SIGNING_CERTIFICATE == ''
        run: echo "::warning::No MACOS_SIGNING_CERTIFICATE secret; builds are ad-hoc signed and macOS will re-prompt for Screen Recording after every update."
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          # Prebuilt CLI via npx (seconds) instead of compiling tauri-cli (minutes).
          tauriScript: npx --yes @tauri-apps/cli@2
          uploadUpdaterJson: true
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: scrme ${{ needs.prepare.outputs.tag }}
          releaseBody: |
            Install: `curl -fsSL https://raw.githubusercontent.com/cubetiqlabs/scrme/main/install.sh | bash`
            or download the .dmg below.
            If macOS asks for Screen Recording after this update, enable it once; later updates keep the permission.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Verify macOS signing
        if: env.MACOS_SIGNING_CERTIFICATE != ''
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/scrme.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- designated requirement ---"
          codesign -d -r- "$APP" 2>&1 | tail -n 1
