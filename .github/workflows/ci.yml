name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Smaller, faster dev/test builds: we never use a debugger in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# Jobs run in parallel; wall time = the slowest one (a release build is not
# needed here: tests already compile everything, and release.yml builds it).
jobs:
  lint:
    name: Format & clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  scripts:
    name: Scripts & workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/release.sh scripts/measure.sh
      - run: node --test src/shared/combo.test.js
      # macOS ships bash 3.2, which reads UTF-8 bytes right after "$VAR" as part of the name
      # (e.g. "$DEST…" -> unbound variable). Brace the variable or use a space.
      - run: "! grep -nP '\\$[A-Za-z_]+[^\\x00-\\x7F]' install.sh scripts/release.sh"
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) && ./actionlint
