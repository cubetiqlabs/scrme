name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Smaller, faster dev/test builds: we never use a debugger in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# Jobs run in parallel; wall time = the slowest one (a release build is not
# needed here: tests already compile everything, and release.yml builds it).
jobs:
  lint:
    name: Format & clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  gpui:
    name: GPUI engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: gpui
      # GPUI compiles its renderer's shaders with `xcrun metal`; Xcode 26 keeps that
      # compiler in a downloadable component, older images ship it with the toolchain.
      - name: Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features gpui-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features gpui-app --lib
      - name: Build the GPUI binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features gpui-app --bin scrme-gpui

  scripts:
    name: Scripts & workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/release.sh scripts/measure.sh
      - run: node --test src/shared/combo.test.js
      - run: node --test src/editor/editor.test.js
      # macOS ships bash 3.2, which reads UTF-8 bytes right after "$VAR" as part of the name
      # (e.g. "$DEST…" -> unbound variable). Brace the variable or use a space.
      - run: "! grep -nP '\\$[A-Za-z_]+[^\\x00-\\x7F]' install.sh scripts/release.sh"
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) && ./actionlint
