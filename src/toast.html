<!doctype html>
<html><head><meta charset="utf-8"><title>toast</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;background:transparent;overflow:hidden}
body{display:grid;place-items:center}
#pill{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 3px;border-radius:999px;position:relative;
  background:var(--grad);color:#fff;font:700 12px var(--font);letter-spacing:.1px;
  box-shadow:0 3px 10px #7c5cff55;opacity:0;transform:translateY(10px) scale(.7)}
#pill.err{background:linear-gradient(135deg,#ff9aa8,#f0476a);box-shadow:0 3px 10px #f0476a55}
#pill.go{animation:pop 1.4s cubic-bezier(.2,.9,.3,1.25) forwards}
#pill.err.go{animation:popErr 1.9s cubic-bezier(.2,.9,.3,1.25) forwards}
.mascot{width:24px;height:24px}
.go .mascot{animation:hop .5s .1s ease-out}
.err.go .mascot{animation:sink .6s .1s ease-out}
.eye{transform-origin:center;transform-box:fill-box}
.go .eye{animation:blink .35s 1s ease-in-out}
.sad{display:none}.err .sad{display:inline}.err .happy{display:none}
.tear{opacity:0}.err.go .tear{animation:drip 1.1s .35s ease-in infinite}
.sp{position:absolute;font-size:8px;line-height:1;opacity:0;color:#fff}
.err .sp{display:none}
.go .sp{animation:twinkle .8s .25s ease-out forwards}
.s1{top:-3px;right:6px}.s2{top:2px;right:-4px;animation-delay:.4s!important;font-size:6px}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.7)}16%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px) scale(.94)}}
@keyframes popErr{0%{opacity:0;transform:translateY(-8px) scale(.8)}12%{opacity:1;transform:none}18%{transform:translateX(-4px)}26%{transform:translateX(4px)}34%{transform:translateX(-3px)}42%{transform:translateX(2px)}50%{transform:none}86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(6px) scale(.94)}}
@keyframes hop{0%{transform:translateY(3px) scale(.9,1.1)}45%{transform:translateY(-4px) scale(1.08,.94)}75%{transform:translateY(0) scale(.96,1.04)}100%{transform:none}}
@keyframes sink{0%{transform:translateY(-3px) rotate(-8deg)}50%{transform:translateY(2px) rotate(6deg) scale(1,.94)}100%{transform:none}}
@keyframes drip{0%{opacity:0;transform:translateY(0)}20%{opacity:.95}80%{opacity:.9;transform:translateY(6px)}100%{opacity:0;transform:translateY(8px)}}
@keyframes twinkle{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.6) rotate(90deg)}}
@keyframes blink{50%{transform:scaleY(.15)}}
</style></head>
<body>
<div id="pill">
  <svg class="mascot" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#fff4fb"/>
    <g class="happy">
      <path class="eye" d="M11 18q2.6-3.4 5.2 0M23.8 18q2.6-3.4 5.2 0" fill="none" stroke="#3b2a6b" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M15.5 24.5q4.5 5 9 0" fill="none" stroke="#3b2a6b" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g class="sad">
      <path class="eye" d="M11 17.5q2.6 3.2 5.2 0M23.8 17.5q2.6 3.2 5.2 0" fill="none" stroke="#3b2a6b" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M11.5 13.5l4.6 1.6M28.5 13.5l-4.6 1.6" fill="none" stroke="#3b2a6b" stroke-width="2" stroke-linecap="round"/>
      <path d="M15.5 28.5q4.5-4.6 9 0" fill="none" stroke="#3b2a6b" stroke-width="2.4" stroke-linecap="round"/>
      <path class="tear" d="M30 22c-1.8 2.6-2.6 3.8-2.6 5a2.6 2.6 0 0 0 5.2 0c0-1.2-.8-2.4-2.6-5z" fill="#6cc4ff"/>
    </g>
    <ellipse cx="9.5" cy="24.5" rx="3.4" ry="2.1" fill="#ffa3c4"/><ellipse cx="30.5" cy="24.5" rx="3.4" ry="2.1" fill="#ffa3c4"/>
  </svg>
  <span id="t">Copied</span><i class="sp s1">✦</i><i class="sp s2">✦</i>
</div>
<script>
window.__play = (text, kind) => {
  const p = document.getElementById('pill');
  document.getElementById('t').textContent = text || 'Copied';
  p.classList.toggle('err', kind === 'err');
  p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); // restart animation
};
</script></body></html>
