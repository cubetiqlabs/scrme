[package]
name = "scrme"
version = "0.1.8"
description = "Tiny, fast screenshot app for the menu bar"
authors = ["Sambo Chea"]
license = "MIT"
repository = "https://github.com/cubetiqlabs/scrme"
homepage = "https://github.com/cubetiqlabs/scrme"
readme = "../README.md"
keywords = ["screenshot", "screen-capture", "tauri", "gpui", "macos"]
categories = ["multimedia"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to
# make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scrme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
block2 = "0.6"
libc = "0.2"

# Tauri engine (the shipped macOS app until the GPUI port reaches feature parity).
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"], optional = true }
tauri-plugin-global-shortcut = { version = "2.4.1", optional = true }
tauri-plugin-clipboard-manager = { version = "2.5.0", optional = true }
tauri-plugin-updater = { version = "2.14.1", optional = true }
tauri-plugin-single-instance = { version = "2.5.5", optional = true }
tauri-plugin-autostart = { version = "2.7.0", optional = true }

# GPUI engine (opt-in, issue #63).
gpui = { version = "0.2.2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
global-hotkey = { version = "0.10.0", optional = true }
dispatch2 = { version = "0.3.1", optional = true }
async-channel = { version = "2", optional = true }

# Native AppKit glue (app activation now; overlay/toast/pin later). Already in the tree via tao/muda.
# Tauri enables every AppKit class; the GPUI build only enables the ones the core uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSButton",
  "NSColor",
  "NSCursor",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSImage",
  "NSImageView",
  "NSPasteboard",
  "NSSavePanel",
  "NSScreen",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"

[features]
default = ["tauri-app"]
# The current shipped engine.
tauri-app = [
  "dep:tauri",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-autostart",
]
# The GPUI engine being built in #63. Build with:
#   cargo run --no-default-features --features gpui-app --bin scrme-gpui
gpui-app = [
  "dep:gpui",
  "dep:tray-icon",
  "dep:global-hotkey",
  "dep:dispatch2",
  "dep:async-channel",
]

[[bin]]
name = "scrme"
path = "src/main.rs"
required-features = ["tauri-app"]

[[bin]]
name = "scrme-gpui"
path = "src/gpui_main.rs"
required-features = ["gpui-app"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
